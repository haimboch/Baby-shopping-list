name: Collect verified product package images

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baby-price-update
  cancel-in-progress: false

jobs:
  collect-product-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHEAPERSAL_API_KEY: ${{ secrets.CHEAPERSAL_API_KEY }}
      PRODUCT_IMAGE_LOOKUP_LIMIT: "72"
      CHEAPERSAL_IMAGE_LOOKUP_LIMIT: "1"
      CHEAPERSAL_MIN_INTERVAL_SECONDS: "7"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate image collector
        run: python self_test.py
      - name: Collect exact-barcode package images
        run: python collect_product_images.py
