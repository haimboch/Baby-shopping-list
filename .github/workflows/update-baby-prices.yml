name: Update Baby Prices

on:
  schedule:
    - cron: "17 */4 * * *"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:
    inputs:
      file_limit:
        description: "Maximum incremental files per source"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: baby-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CHEAPERSAL_API_KEY: ${{ secrets.CHEAPERSAL_API_KEY }}
      ENABLED_CHAINS: "shufersal,be,rami_levy,yochananof,osher_ad,super_pharm,ksp"
      ENRICHMENT_LIMIT: "8"
      KSP_MAX_ITEMS: "120"
      KSP_CATEGORY_PAGES: "3"
      KSP_SEARCH_LIMIT: "12"
      SUPER_PHARM_FULL_FILE_LIMIT: "30"
      SUPER_PHARM_INCREMENTAL_FILE_LIMIT: "30"
      SUPER_PHARM_PROMO_FULL_FILE_LIMIT: "30"
      SUPER_PHARM_PROMO_INCREMENTAL_FILE_LIMIT: "30"
      SUPER_PHARM_ONLINE_MAX_ITEMS: "90"
      SUPER_PHARM_ONLINE_CATEGORY_PAGES: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self test
        run: python self_test.py

      - name: Update price feeds
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export WORKER_FILE_LIMIT="${{ inputs.file_limit }}"
          else
            export WORKER_FILE_LIMIT="20"
          fi
          python run_worker.py

      - name: Generate price notifications
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${SUPABASE_URL}/rest/v1/rpc/generate_price_notification_events_v035" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}'
